---
- name: Clone Windows VMs from Proxmox templates with least-loaded placement (VMID-only + preflight)
  hosts: local
  gather_facts: false

  vars_files:
    - vars/proxmox.yml            # include: proxmox_api_* vars, validate_certs, target_storage, template_map, allowed_templates, default_vm
    - vars/vms.yml                # include: vms: [ { name, template, vmid? ... } ]
    - "{{ lookup('env', 'ANSIBLE_PROXMOX_SECRET_FILE') }}"   # ansible-vault encrypted secrets

  collections:
    - community.proxmox           # used for post-clone updates (proxmox_kvm) and info modules if needed

  pre_tasks:
    - name: Validate provided template_name (if passed)
      assert:
        that:
          - template_name is not defined or (template_name in allowed_templates)
        fail_msg: "template_name is not in allowed_templates"

    # Merge defaults (defaults -> per-VM overrides)
    - name: Reset expanded list
      set_fact:
        vms_expanded: []

    - name: Merge defaults into each VM (defaults -> per-VM overrides)
      set_fact:
        vms_expanded: "{{ vms_expanded + [ default_vm | combine(item, recursive=True) ] }}"
      loop: "{{ vms }}"
      loop_control:
        label: "{{ item.name | default('unnamed-vm') }}"

    # Assert templates are present
    - name: Ensure every VM has a template or a global template_name is provided
      assert:
        that:
          - (vms_expanded | map(attribute='template') | select('defined') | list | length) == (vms_expanded | length)
            or (template_name is defined)
        fail_msg: >
          No template defined. Either set `template:` per VM in vars/vms.yml,
          or pass -e template_name=... (and include it in allowed_templates).

    # Optional: Validate keys in template_map (comment if you sometimes pass numeric VMIDs directly)
    - name: Validate per-VM template key exists in template_map
      assert:
        that:
          - (item.template is string) and (item.template in template_map)
        fail_msg: "VM {{ item.name }} uses template key '{{ item.template }}' not in template_map."
      loop: "{{ vms_expanded }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.template is string

    # Build auth header for REST calls (we use REST for cluster discovery, nextid, clone)
    - name: Build auth header for Proxmox API (token)
      set_fact:
        pve_auth_header:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"

    # --- Cluster node load (CPU/mem) to choose target node ---
    - name: Get cluster node resources (CPU/mem/disk, online status)
      uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/cluster/resources?type=node"
        method: GET
        headers: "{{ pve_auth_header }}"
        return_content: true
        validate_certs: "{{ proxmox_validate_certs }}"
      register: cluster_nodes_raw
      # API: /cluster/resources?type=node returns node status and load fields  # [2](https://pve.proxmox.com/wiki/Cloud-Init_Support)

    - name: Build base list of online nodes
      set_fact:
        _nodes_base: >-
          {{
            cluster_nodes_raw.json.data
            | selectattr('type','equalto','node')
            | selectattr('status','equalto','online')
            | list
          }}

    - name: Optionally filter by allowed_nodes
      set_fact:
        _nodes_filtered: "{{ _nodes_base | selectattr('node','in', allowed_nodes) | list }}"
      when: allowed_nodes | default([]) | length > 0

    - name: Use base list when no allow-list was provided
      set_fact:
        _nodes_filtered: "{{ _nodes_base }}"
      when: allowed_nodes | default([]) | length == 0

    - name: Keep only entries with a defined 'cpu' field
      set_fact:
        _nodes_with_cpu: "{{ _nodes_filtered | selectattr('cpu','defined') | list }}"

    - name: Decide sort source list
      set_fact:
        _nodes_sort_source: >-
          {{ (_nodes_with_cpu if (_nodes_with_cpu | length) > 0 else _nodes_filtered) }}

    - name: Sort eligible nodes (CPU if available, else name)
      set_fact:
        _nodes_sorted: >-
          {{
            (_nodes_sort_source | sort(attribute='cpu'))
            if (_nodes_with_cpu | length) > 0
            else
            (_nodes_sort_source | sort(attribute='node'))
          }}

    # ---- Verify storage active (or fall back) ----
    - name: Check storage availability for each candidate node
      uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ item.node }}/storage/{{ target_storage }}/status"
        method: GET
        headers: "{{ pve_auth_header }}"
        return_content: true
        validate_certs: "{{ proxmox_validate_certs }}"
        status_code: [200, 403]   # tolerate 403; if storage perms are limited, we’ll fall back to load sort
      loop: "{{ _nodes_sorted }}"
      loop_control:
        label: "{{ item.node }}"
      register: stor_status

    - name: Build final eligible node list (prefer nodes where storage is active; fallback to sorted list)
      set_fact:
        eligible_nodes: >-
          {{
            (
              stor_status.results
              | selectattr('status','equalto',200)
              | selectattr('json.data.active','truthy')
              | map(attribute='item.node')
              | list
            )
            if (stor_status.results | selectattr('status','equalto',200) | list | length) > 0
            else
            (_nodes_sorted | map(attribute='node') | list)
          }}

    - name: Ensure we have at least one eligible node
      assert:
        that:
          - (eligible_nodes | length) > 0
        fail_msg: "No eligible nodes found. Check token permissions, node status, and storage '{{ target_storage }}' availability."

    # ---- Resolve source_vmid (from template_map or numeric) and pick target_node (least-loaded) ----
    - name: Resolve source_vmid and candidate target_node per VM
      set_fact:
        vms_resolved: >-
          {{
            (vms_resolved | default([]))
            + [
              item | combine({
                'source_vmid':
                  (
                    template_map[item.template]
                    if (item.template is string and (template_map[item.template] | default(None)) is not none)
                    else (item.template | int)
                  ),
                'target_node':
                  (
                    item.node
                    if (((item.node | default('')) | length) > 0)
                    else eligible_nodes[idx % (eligible_nodes | length)]
                  )
              }, recursive=True)
            ]
          }}
      loop: "{{ vms_expanded }}"
      loop_control:
        index_var: idx
        label: "{{ item.name }}"

    # --- Discover template source_node (cluster inventory + fallback probe) ---

    - name: Get cluster VM inventory (vmid/node, cluster-wide)
      uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/cluster/resources?type=vm"
        method: GET
        headers: "{{ pve_auth_header }}"
        validate_certs: "{{ proxmox_validate_certs }}"
        return_content: true
      register: cluster_vms_raw

    - name: Build vmid -> node index (from all VMs)
      set_fact:
        _vm_index_all: "{{ dict((cluster_vms_raw.json.data
                                  | selectattr('vmid','defined')
                                  | map(attribute='vmid') | list)
                                | zip(cluster_vms_raw.json.data
                                      | selectattr('vmid','defined')
                                      | map(attribute='node') | list)) }}"

    - name: Reset vms_ready
      set_fact:
        vms_ready: []

    - name: First pass - add source_node from inventory
      set_fact:
        vms_ready: "{{ vms_ready + [ item | combine({'source_node': (_vm_index_all[item.source_vmid] | default('')) }, recursive=True) ] }}"
      loop: "{{ vms_resolved }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Online nodes list
      set_fact:
        _all_nodes: "{{ cluster_nodes_raw.json.data
                      | selectattr('type','equalto','node')
                      | selectattr('status','equalto','online')
                      | map(attribute='node') | list }}"

    - name: VMs still missing source_node
      set_fact:
        _need_probe: "{{ (vms_ready | selectattr('source_node','undefined') | list)
                        + (vms_ready | selectattr('source_node','defined') | selectattr('source_node','equalto','') | list) }}"

    - name: Probe template location across nodes
      uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ item.1 }}/qemu/{{ item.0.source_vmid }}/config"
        method: GET
        headers: "{{ pve_auth_header }}"
        validate_certs: "{{ proxmox_validate_certs }}"
        return_content: true
        status_code: [200, 403, 404, 500]
      register: _probe
      failed_when: false
      loop: "{{ _need_probe | product(_all_nodes) | list }}"
      loop_control:
        label: "{{ item.0.name }} @ {{ item.1 }}"

    - name: Successful probe hits
      set_fact:
        _probe_hits: "{{ _probe.results | selectattr('status','equalto',200) | list }}"

    - name: Build vmid -> node map from probe hits
      set_fact:
        _probe_map: "{{ dict((_probe_hits | map(attribute='item.0.source_vmid') | list)
                              | zip(_probe_hits | map(attribute='item.1') | list)) }}"

    - name: Reset merged list
      set_fact:
        _vms_ready_merged: []

    - name: Merge probe results back into vms_ready
      set_fact:
        _vms_ready_merged: "{{ _vms_ready_merged
                              + [ item | combine({'source_node':
                                                    (item.source_node
                                                      if (item.source_node | default('') | length) > 0
                                                      else (_probe_map[item.source_vmid] | default('')))},
                                                  recursive=True) ] }}"
      loop: "{{ vms_ready }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Finalize vms_ready
      set_fact:
        vms_ready: "{{ _vms_ready_merged }}"

    - name: Ensure we discovered a source_node for each template VMID
      assert:
        that:
          - (vms_ready[idx].source_node | length) > 0
        fail_msg: >-
          Could not determine source node for template VMID {{ vms_ready[idx].source_vmid }} ({{ vms_ready[idx].template }}).
          Confirm the VMID exists and is visible in cluster inventory, or grant VM.Audit on /vms/{{ vms_ready[idx].source_vmid }}.
      loop: "{{ range(0, vms_ready | length) | list }}"
      loop_control:
        index_var: idx
        label: "{{ vms_ready[idx].name }}"

    # ---- Allocate newid via /cluster/nextid if vmid not specified per-VM ----
    - name: Initialize list with VMIDs resolved
      set_fact:
        vms_ready_with_ids: []

    - name: Collect VMs that already have a vmid
      set_fact:
        vms_ready_with_ids: "{{ vms_ready_with_ids + [ item ] }}"
      loop: "{{ vms_ready }}"
      when: item.vmid is defined
      loop_control:
        label: "{{ item.name }}"

    - name: Build list of VMs missing vmid
      set_fact:
        _vms_missing_vmid: "{{ vms_ready | selectattr('vmid','undefined') | list }}"

    - name: Get next free VMID for each VM missing vmid
      uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/cluster/nextid"
        method: GET
        headers: "{{ pve_auth_header }}"
        validate_certs: "{{ proxmox_validate_certs }}"
        return_content: true
      loop: "{{ _vms_missing_vmid }}"
      loop_control:
        label: "{{ item.name }}"
      register: _nextids
      # /cluster/nextid provides a free newid for cloning/creation  # [2](https://pve.proxmox.com/wiki/Cloud-Init_Support)

    - name: Append items with allocated vmid
      set_fact:
        vms_ready_with_ids: >-
          {{
            vms_ready_with_ids
            + [ (_vms_missing_vmid[idx] | combine({'vmid': (_nextids.results[idx].json.data | int)})) ]
          }}
      loop: "{{ range(0, (_vms_missing_vmid | length)) | list }}"
      loop_control:
        index_var: idx
        label: "{{ _vms_missing_vmid[idx].name }}"

  tasks:
    # ===========================
    # PREFLIGHT PERMISSION CHECKS
    # ===========================
    # We verify required privileges before cloning:
    # - VM.Clone on /vms/<source_vmid> (source)
    # - VM.Allocate on /vms (destination)
    # - Datastore.AllocateSpace on /storage/<target_storage> (write disks)
    # These checks use /access/permissions?path=..., which reports privileges of the current token,
    # and avoids userid lookups (which can require Sys.Audit).  # [3](https://www.reddit.com/r/Proxmox/comments/1ch32wt/proxmox_windows_cloudbaseinit/)

    - name: Check privileges on source VM path (VM.Clone)
      uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/access/permissions?path=/vms/{{ item.source_vmid }}"
        method: GET
        headers: "{{ pve_auth_header }}"
        validate_certs: "{{ proxmox_validate_certs }}"
        return_content: true
      register: src_perms
      loop: "{{ vms_ready_with_ids }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Assert VM.Clone present on source
      assert:
        that:
          - (src_perms.results[idx].json.data['VM.Clone'] | default(false)) | bool
        fail_msg: "Missing VM.Clone on /vms/{{ vms_ready_with_ids[idx].source_vmid }} for {{ vms_ready_with_ids[idx].name }}"
      loop: "{{ range(0, vms_ready_with_ids | length) | list }}"
      loop_control:
        index_var: idx
        label: "{{ vms_ready_with_ids[idx].name }}"

    - name: Check privileges on destination path (VM.Allocate on /vms)
      uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/access/permissions?path=/vms"
        method: GET
        headers: "{{ pve_auth_header }}"
        validate_certs: "{{ proxmox_validate_certs }}"
        return_content: true
      register: dst_vms_perms

    - name: Assert VM.Allocate present on /vms
      assert:
        that:
          - (dst_vms_perms.json.data['VM.Allocate'] | default(false)) | bool
        fail_msg: "Missing VM.Allocate on /vms for current token. Grant PVEVMAdmin or a role including VM.Allocate."

    - name: Check privileges on target storage (Datastore.AllocateSpace)
      uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/access/permissions?path=/storage/{{ target_storage }}"
        method: GET
        headers: "{{ pve_auth_header }}"
        validate_certs: "{{ proxmox_validate_certs }}"
        return_content: true
      register: store_perms

    - name: Assert Datastore.AllocateSpace present on storage
      assert:
        that:
          - (store_perms.json.data['Datastore.AllocateSpace'] | default(false)) | bool
        fail_msg: "Missing Datastore.AllocateSpace on /storage/{{ target_storage }} for current token."

    # ===============================
    # VMID-ONLY CLONE VIA REST API
    # ===============================

    - name: DEBUG — parameters to be passed to REST clone (source VMID path)
      debug:
        msg:
          url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ item.source_node }}/qemu/{{ item.source_vmid }}/clone"
          method: "POST"
          validate_certs: "{{ proxmox_validate_certs }}"
          body:
            name: "{{ item.name }}"
            full: "1"                        # full clone
            storage: "{{ item.target_storage }}"
            format: "qcow2"
            pool: "{{ item.pool | default(omit) }}"
            target: "{{ item.target_node }}"  # destination node
            newid: "{{ item.vmid }}"          # REQUIRED by clone endpoint on many PVE versions
      loop: "{{ vms_ready_with_ids }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: Begin clone via API (force VMID path; no source name involved)
      uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ item.source_node }}/qemu/{{ item.source_vmid }}/clone"
        method: POST
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
          Content-Type: "application/x-www-form-urlencoded"
        body_format: form-urlencoded
        body:
          name: "{{ item.name }}"
          full: "1"
          storage: "{{ item.target_storage }}"
          format: "qcow2"
          pool: "{{ item.pool | default(omit) }}"
          target: "{{ item.target_node }}"
          newid: "{{ item.vmid }}"
        validate_certs: "{{ proxmox_validate_certs }}"
        status_code: 200
        return_content: true
      register: clone_task
      loop: "{{ vms_ready_with_ids }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Wait for clone task to finish
      uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ item.item.source_node }}/tasks/{{ item.json.data }}/status"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
        validate_certs: "{{ proxmox_validate_certs }}"
        return_content: true
      register: clone_wait
      until: (clone_wait.json.data.status | default('')) in ['stopped', 'OK']
      retries: 300
      delay: 1
      loop: "{{ clone_task.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    # ===============================
    # POST-CLONE: Cloud-Init update + power on
    # ===============================

    - name: Apply cloud-init network settings (ipconfig / nameservers / VLAN)
      community.proxmox.proxmox_kvm:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        validate_certs: "{{ proxmox_validate_certs }}"

        node: "{{ item.target_node }}"
        name: "{{ item.name }}"
        update: yes

        net:
          net0: >-
            virtio,bridge={{ item.bridge | default('vmbr0') }}
            {% if item.vlan is defined and item.vlan %},tag={{ item.vlan }}{% endif %}
            {% if item.macaddr is defined %},macaddr={{ item.macaddr }}{% endif %}

        ipconfig: >-
          {{
            {
              'ipconfig0':
                (
                  (
                    'ip=' + (item.ip | regex_replace('/\\d+$',''))
                    + '/'
                    + (item.ip | regex_search('/(\\d+)$') | first | default('24'))
                  )
                  + (',gw=' + item.gw if (item.gw | default('')) != '' else '')
                )
                if (item.ip | default('')) != ''
                else 'ip=dhcp'
            }
          }}

        nameservers: "{{ item.nameservers | default(item.nameserver | default(omit)) }}"
        searchdomains: "{{ item.searchdomains | default(omit) }}"
      loop: "{{ vms_ready_with_ids }}"
      loop_control:
        label: "{{ item.name }}"
      # Module param names per community.proxmox.proxmox_kvm docs (net/ipconfig/nameservers/state).  # [4](https://www.xda-developers.com/i-automated-my-proxmox-tasks-with-ansible/)

    - name: Ensure VM is started
      community.proxmox.proxmox_kvm:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ proxmox_api_token_secret }}"
        validate_certs: "{{ proxmox_validate_certs }}"
        node: "{{ item.target_node }}"
        name: "{{ item.name }}"
        state: started
      loop: "{{ vms_ready_with_ids }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Wait for WinRM (5986) if static IP is provided
      wait_for:
        host: "{{ (item.ip | default('')) | regex_replace('/\\d+$','') }}"
        port: 5986
        delay: 10
        timeout: 900
        state: started
      when:
        - (item.wait_for_guest | default(true))
        - (item.ip | default('')) != ''
      loop: "{{ vms_ready_with_ids }}"
      loop_control:
        label: "{{ item.name }}"