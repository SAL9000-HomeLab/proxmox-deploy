# Proxmox API & TLS
proxmox_api_host: "pve01.lab.sal9000.tech"         # Any PVE node or the cluster VIP
proxmox_api_user: "ansible-local@pam"
proxmox_api_token_id: "ci-runner"
proxmox_validate_certs: false               # true if you use valid TLS certs

# Scheduling / placement
# Optionally restrict placement to specific nodes (leave empty to allow all)
allowed_nodes: []                           # e.g. ["pve01","pve02","pve03"]

# Storage to check for "active" status on each node
target_storage: "nfs_ssd"

# Templates you allow at runtime
allowed_templates:
  - "W25StdCore"
  - "W25StdGUI"
  - "W22StdCore"
  - "W22StdGUI"
  - "W19StdCore"
  - "W19StdGUI"

template_map:
  W25StdCore: 9001
  W25StdGUI:  9002
  W22StdCore: 9003
  W22StdGUI:  9004
  W19StdCore: 9005
  W19StdGUI:  9006

# Cluster-wide defaults for VMs (overridable per VM)
default_vm:
  pool: "Test"
  template: "{{ template_name | default(omit) }}"
  target_storage: "{{ target_storage }}"
  # CPU/RAM defaults
  sockets: 1
  cores: 2
  memory: 4096
  # Windows guest best practices
  ostype: "win11"
  scsihw: "virtio-scsi-single"   # controller model
  agent: 1
  onboot: true
  kvm: true
  # Network defaults
  bridge: "vmbr0"
  vlan: null
  # Cloud-init values passed via config drive
  ciuser: "ansible-local"
  nameservers: "10.100.30.101 10.100.30.111"
  # Start & wait behavior
  start_after_clone: true
  wait_for_guest: true
  wait_for_port: 5986            # HTTPS WinRM by default for Windows
  # Tags
  tags: "windows"