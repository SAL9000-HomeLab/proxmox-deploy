---
# roles/proxmox_clone/defaults/main.yml

# High-level defaults used by the role (non-sensitive)
proxmox_defaults:
  node: pve01.lab.sal9000.tech
  storage: nfs_ssd
  snippets_dir: /var/lib/vz/snippets
  disk_target: scsi0
  full_clone: true
  net_bridge: vmbr0
  net_model: virtio
  vlan: 30
  timeout: 300
  timezone: "EST"


# General proxmox group defaults (used as a secondary lookup)
# Keep only non-sensitive values here; secrets belong in vaulted files.
proxmox:
  node: "{{ proxmox_defaults.node }}"
  storage: "{{ proxmox_defaults.storage }}"
  cores: 2          # prefer "cores" to match per-VM field name
  memory: 2048
  scsihw: "virtio-scsi-pci"
  bootdisk: scsi0
  net_bridge: "{{ proxmox_defaults.net_bridge }}"
  net_model: "{{ proxmox_defaults.net_model }}"
  vlan: "{{ proxmox_defaults.vlan }}"

# Default vm list (empty) - real VM definitions should be placed in group_vars or host_vars
provision_vms: []

# Example (commented) for maintainers:
# - name: web-01
#   template_vmid: 9000
