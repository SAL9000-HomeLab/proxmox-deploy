---
# roles/proxmox_clone/tasks/configure.yml
# Reconcile CPU/memory, network/VLAN, tags, and disk size against the current
# qm config (idempotent — only runs qm set/resize when something differs).
# Expects vm_item loop variable and facts from resolve_vars.yml / clone.yml.

# --- adjust CPU & memory to match desired settings (idempotent) ----------
- name: Compute desired cores and memory (vm -> proxmox -> defaults)
  set_fact:
    desired_cores: >-
      {{ vm_item.cores
         | default(proxmox.cpu if (proxmox is defined and 'cpu' in proxmox) else (proxmox_defaults.cpu if (proxmox_defaults is defined and 'cpu' in proxmox_defaults) else 2) )
      }}
    desired_memory: >-
      {{ vm_item.memory
         | default(proxmox.memory if (proxmox is defined and 'memory' in proxmox) else (proxmox_defaults.memory if (proxmox_defaults is defined and 'memory' in proxmox_defaults) else 2048) )
      }}
  run_once: false

- name: Parse current cores & memory from qm config (if present)
  set_fact:
    current_cores: "{{ (qm_config.stdout | regex_search('(?<=cores: )\\d+') ) | default('') }}"
    current_memory: "{{ (qm_config.stdout | regex_search('(?<=memory: )\\d+') ) | default('') }}"
  when: qm_config is defined
  run_once: false

- name: Build qm set argv for CPU/memory changes (include only differing flags)
  set_fact:
    qm_set_cfg_argv: >-
      {{
        [
          'qm', 'set', (desired_vmid | string)
        ]
        +
        ( ['--cores', (desired_cores | string)] if ( (current_cores | default('')) | string != (desired_cores | string) ) else [] )
        +
        ( ['--memory', (desired_memory | string)] if ( (current_memory | default('')) | string != (desired_memory | string) ) else [] )
      }}
  run_once: false

- name: Apply cores/memory changes via qm set (only when flags present)
  ansible.builtin.command:
    argv: "{{ qm_set_cfg_argv }}"
  delegate_to: "{{ node_name }}"
  become: true
  register: qm_set_cfg_result
  # Mark changed when the command ran successfully (rc == 0).
  # Also guard references so we don't fail if the var is undefined.
  changed_when: >
    (qm_set_cfg_result is defined) and
    (qm_set_cfg_result.rc == 0)
  # Fail only when the command returned non-zero and the stderr
  # doesn't contain an expected benign message.
  failed_when: >
    (qm_set_cfg_result is defined) and
    (qm_set_cfg_result.rc is not none) and
    (qm_set_cfg_result.rc != 0) and
    ('already configured' not in (qm_set_cfg_result.stderr | default('')))
  when: qm_set_cfg_argv | length > 3   # only run if we added flags beyond qm set <vmid>
  run_once: false

# --- Ensure network and VLAN match desired settings (idempotent) ----------

- name: Resolve VM bridge
  ansible.builtin.set_fact:
    net_bridge_resolved: >-
      {{
        vm_item.net_bridge
        | default(
            proxmox_cb.get('net_bridge')
            | default(proxmox_defaults_cb.get('net_bridge'))
          )
      }}
    net_model_resolved: "{{ vm_item.net_model | default('virtio') }}"

- name: Build net0 configuration string
  ansible.builtin.set_fact:
    net0_config: >-
      {{ net_model_resolved }},
      bridge={{ net_bridge_resolved }}
      {% if vm_item.vlan is defined and vm_item.vlan | string | length > 0 %}
      ,tag={{ vm_item.vlan }}
      {% endif %}

- name: Parse current net0 config from qm config
  set_fact:
    current_net0: "{{ (qm_config.stdout | default('')) | regex_search('(?<=net0: ).*') | default('') }}"
    current_net0_model: "{{ (qm_config.stdout | default('')) | regex_search('(?<=net0: )[a-zA-Z0-9]+(?==)') | default('') }}"

- name: Configure network device (bridge + VLAN, only if different)
  ansible.builtin.command:
    argv:
      - qm
      - set
      - "{{ desired_vmid }}"
      - --net0
      - "{{ net0_config | regex_replace('\\s+', '') }}"
  delegate_to: "{{ node_name }}"
  register: net_config_result
  changed_when: net_config_result.rc == 0
  when: >
    (current_net0_model != net_model_resolved)
    or (('bridge=' ~ net_bridge_resolved) not in current_net0)
    or ((vm_item.vlan is defined and vm_item.vlan | string | length > 0) and (('tag=' ~ (vm_item.vlan | string)) not in current_net0))
    or ((vm_item.vlan is not defined or vm_item.vlan | string | length == 0) and ('tag=' in current_net0))

- name: Parse current tags from qm config
  set_fact:
    current_tags: >-
      {{ ((qm_config.stdout | default('')) | regex_search('(?<=tags: ).*') | default('')).split(',') | map('trim') | select | list | sort }}
    desired_tags: "{{ (vm_item.tags.split(',') | map('trim') | list | sort) if vm_item.tags is defined else [] }}"

- name: Set Proxmox VM tags (if defined and different)
  ansible.builtin.command:
    cmd: qm set {{ desired_vmid }} --tags {{ vm_item.tags }}
  delegate_to: "{{ node_name }}"
  become: true
  register: tags_result
  changed_when: tags_result.rc == 0
  when:
    - vm_item.tags is defined
    - current_tags != desired_tags

# --- disk size parsing -------------------------------------------------------

- name: Parse current bootdisk raw/fallback lists from qm config (safe)
  set_fact:
    current_disk_size_raw_list: "{{ (qm_config.stdout | default('')) | regex_findall(disk_target ~ ':[^\\n]*size=([^,\\n\\s]+)') }}"
    current_disk_size_fallback_list: "{{ (qm_config.stdout | default('')) | regex_findall(disk_target ~ ':[^\\n]*,([^,\\n\\s]*G)') }}"
  run_once: false

- name: Pick first parsed disk size raw & fallback into simple vars
  set_fact:
    current_disk_size_raw: "{{ (current_disk_size_raw_list | first) | default('') }}"
    current_disk_size_fallback: "{{ (current_disk_size_fallback_list | first) | default('') }}"
  run_once: false

- name: Compute final current_disk_size (prefer raw then fallback)
  set_fact:
    current_disk_size: >-
      {{ current_disk_size_raw if (current_disk_size_raw is defined and (current_disk_size_raw | length) > 0)
         else (current_disk_size_fallback | default('')) }}
  run_once: false

- name: Compute desired_disk_gib and current_disk_gib (numeric GiB)
  set_fact:
    desired_disk_gib: "{{ (vm_item.disk_size | default('0')) | regex_replace('(?i)g$','') | regex_replace('[^0-9\\.]+','') | float | default(0) }}"
    current_disk_gib: "{{ (current_disk_size | default('0')) | regex_replace('(?i)g$','') | regex_replace('[^0-9\\.]+','') | float | default(0) }}"
  when: vm_item.disk_size is defined
  run_once: false

- name: Decide whether resize is needed (compare numeric GiB)
  set_fact:
    should_resize: "{{ (desired_disk_gib | float) > (current_disk_gib | float) }}"
  when: vm_item.disk_size is defined
  run_once: false

# --- robust resize block -----------------------------------------------------

- name: Discover candidate disk keys from qm config
  set_fact:
    _qm_disk_keys: "{{ (qm_config.stdout | default('')) | regex_findall('(?:\\n|^)\\s*([a-zA-Z0-9_]+\\d*):') }}"
  run_once: false

- name: Ensure disk_target_resolved is set (vm_item -> vars -> parse qm_config -> fallback)
  set_fact:
    disk_target_resolved: >-
      {{
        (vm_item.disk_target | default(''))
        | default( disk_target | default(proxmox_defaults.disk_target | default('')) )
        | default( (_qm_disk_keys | first) | default('scsi0') )
      }}
  run_once: false

- name: Resize disk to desired size (qm disk resize)
  ansible.builtin.command:
    cmd: >-
      qm disk resize {{ desired_vmid }} {{ disk_target_resolved }} {{ vm_item.disk_size }}
  delegate_to: "{{ node_name }}"
  become: true
  register: qm_resize_result
  changed_when: qm_resize_result.rc == 0
  when:
    - not target_exists
    - vm_item.disk_size is defined
    - should_resize | default(true)
