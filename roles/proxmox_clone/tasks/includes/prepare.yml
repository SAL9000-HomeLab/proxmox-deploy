---
- name: Prepare safe defaults (avoid undefined attribute access)
  set_fact:
    proxmox_cb: "{{ proxmox if (proxmox is defined) else {} }}"
    proxmox_defaults_cb: "{{ proxmox_defaults if (proxmox_defaults is defined) else {} }}"
    proxmox_behavior_cb: "{{ proxmox_clone_behavior if (proxmox_clone_behavior is defined) else {} }}"
  run_once: false

- name: Normalize Proxmox configuration
  set_fact:
    vm_proxmox:
      vmid: >-
        {{
          vm_item.vmid
          if (vm_item.vmid is defined and vm_item.vmid)
          else next_vmid
        }}

      node: >-
        {{
          vm_item.node
          | default(proxmox_cb.get('node'))
          | default(proxmox_defaults_cb.get('node'))
        }}

      storage: >-
        {{
          vm_item.storage
          | default(proxmox_cb.get('storage'))
          | default(proxmox_defaults_cb.get('storage'))
        }}

      template_vmid: "{{ vm_item.template_vmid }}"

      vm_proxmox.disk_target: >-
        {{
          vm_item.vm_proxmox.disk_target
          | default(proxmox_cb.get('vm_proxmox.disk_target'))
          | default(proxmox_defaults_cb.get('vm_proxmox.disk_target'))
        }}

      full_clone: >-
        {{
          vm_item.full
          | default(proxmox_cb.get('full_clone'))
          | default(proxmox_defaults_cb.get('full_clone'))
          | bool
        }}

      cores: >-
        {{
          vm_item.cores
          | default(proxmox_cb.get('cores'))
          | default(proxmox_defaults_cb.get('cores'))
        }}

      memory: >-
        {{
          vm_item.memory
          | default(proxmox_cb.get('memory'))
          | default(proxmox_defaults_cb.get('memory'))
        }}

      bridge: "{{ vm_item.net_bridge | default(proxmox_cb.get('net_bridge')) }}"

      vlan: "{{ vm_item.vlan | default(omit) }}"

- name: Run qm list on node to discover existing VMs
  ansible.builtin.command:
    cmd: qm list
  delegate_to: "{{ vm_proxmox.node }}"
  become: true
  register: qm_list_full
  changed_when: false

- name: Determine if target vmid exists on node
  set_fact:
    target_exists: "{{ (qm_list_full.stdout_lines | select('match', '^\\s*' + (vm_proxmox.vmid | string) + '\\s') | list) | length > 0 }}"
  run_once: false

- name: Determine if template vmid exists on node
  set_fact:
    template_exists: "{{ (qm_list_full.stdout_lines | select('match', '^\\s*' + (vm_item.template_vmid | string) + '\\s') | list) | length > 0 }}"
  run_once: false

- name: Fail if template not present on node
  fail:
    msg: "Template vmid {{ vm_item.template_vmid }} not found on node {{ vm_proxmox.node }}. qm list: {{ qm_list_full.stdout_lines | join('\\n') }}"
  when: not template_exists
  delegate_to: "{{ vm_proxmox.node }}"
  become: true

# --- Ensure we have a valid vm_proxmox.vmid (auto-allocate if vm_item.vmid not set) ---
- name: Lookup next available VMID on node (if needed)
  ansible.builtin.command:
    cmd: qm nextid
  delegate_to: "{{ vm_proxmox.node }}"
  become: true
  register: qm_nextid_raw
  failed_when: false
  changed_when: false
  when: vm_proxmox.vmid | default(0) | int == 0

- name: Set next_vmid from qm nextid output (or fallback)
  set_fact:
    next_vmid: >-
      {{ (qm_nextid_raw.stdout | default('') | regex_search('\\d+', '\\0') | default('')) | int
         if (qm_nextid_raw is defined and (qm_nextid_raw.stdout | default('') | length) > 0)
         else (next_vmid | default(100) | int) }}
  when: vm_proxmox.vmid | default(0) | int == 0
  run_once: false

- name: Use auto-allocated next_vmid if vm_proxmox.vmid was empty/zero
  set_fact:
    vm_proxmox.vmid: "{{ next_vmid | int }}"
  when: vm_proxmox.vmid | default(0) | int == 0
  run_once: false

- name: Assert vm_proxmox.vmid is valid
  assert:
    that:
      - vm_proxmox.vmid is defined
      - (vm_proxmox.vmid | int) > 0
    fail_msg: "vm_proxmox.vmid is missing or invalid ({{ vm_proxmox.vmid }}). qm nextid output: {{ qm_nextid_raw.stdout | default('') }}"
