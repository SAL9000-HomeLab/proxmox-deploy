---
# roles/proxmox_clone/tasks/provision_vm.yml
# Cleaned per-VM provisioning tasks (SSH/qm-based, delegated to node)
# Expects vm_item loop variable.
# NOTE: removed pool and HA-related tasks entirely per request.

- name: Prepare safe defaults (avoid undefined attribute access)
  set_fact:
    proxmox_cb: "{{ proxmox if (proxmox is defined) else {} }}"
    proxmox_defaults_cb: "{{ proxmox_defaults if (proxmox_defaults is defined) else {} }}"
    proxmox_behavior_cb: "{{ proxmox_clone_behavior if (proxmox_clone_behavior is defined) else {} }}"
  run_once: false

- name: Prepare VM variables (robust defaults, uses .get())
  set_fact:
    desired_vmid: >-
      {{ vm_item.vmid if (vm_item.vmid is defined and vm_item.vmid) else (next_vmid | default(0)) }}
    cloud_type: "{{ vm_item.os_type | default('linux') }}"
    node_name: >-
      {{ vm_item.node
         | default( proxmox_cb.get('node') | default(proxmox_defaults_cb.get('node','pve01')) ) }}
    storage_name: >-
      {{ vm_item.storage
         | default( proxmox_cb.get('storage') | default(proxmox_defaults_cb.get('storage','local')) ) }}
    vm_name: "{{ vm_item.name }}"
    disk_target: >-
      {{ vm_item.disk_target
         | default(
           proxmox_behavior_cb.get('disk_target')
           | default( proxmox_cb.get('disk_target') | default(proxmox_defaults_cb.get('disk_target','scsi0')) )
         )
      }}
    use_full_clone: >-
      {{ vm_item.full
         | default(
           proxmox_behavior_cb.get('full_clone')
           | default( proxmox_cb.get('full_clone') | default(proxmox_defaults_cb.get('full_clone', true)) )
         )
      | bool }}
  run_once: false

- name: Run qm list on node to discover existing VMs
  ansible.builtin.command:
    cmd: qm list
  delegate_to: "{{ node_name }}"
  become: true
  register: qm_list_full
  changed_when: false

- name: Determine if target vmid exists on node
  set_fact:
    target_exists: "{{ (qm_list_full.stdout_lines | select('match', '^\\s*' + (desired_vmid | string) + '\\s') | list) | length > 0 }}"
  run_once: false

- name: Determine if template vmid exists on node
  set_fact:
    template_exists: "{{ (qm_list_full.stdout_lines | select('match', '^\\s*' + (vm_item.template_vmid | string) + '\\s') | list) | length > 0 }}"
  run_once: false

- name: Fail if template not present on node
  fail:
    msg: "Template vmid {{ vm_item.template_vmid }} not found on node {{ node_name }}. qm list: {{ qm_list_full.stdout_lines | join('\\n') }}"
  when: not template_exists
  delegate_to: "{{ node_name }}"
  become: true

# --- Ensure we have a valid desired_vmid (auto-allocate if vm_item.vmid not set) ---
- name: Lookup next available VMID on node (if needed)
  ansible.builtin.command:
    cmd: qm nextid
  delegate_to: "{{ node_name }}"
  become: true
  register: qm_nextid_raw
  failed_when: false
  changed_when: false
  when: desired_vmid | default(0) | int == 0

- name: Set next_vmid from qm nextid output (or fallback)
  set_fact:
    next_vmid: "{{ (qm_nextid_raw.stdout | default('') | regex_search('\\d+') | default('')) | int if (qm_nextid_raw is defined and (qm_nextid_raw.stdout | default('') | length) > 0) else (next_vmid | default(100) | int) }}"
  when: desired_vmid | default(0) | int == 0
  run_once: false

- name: Use auto-allocated next_vmid if desired_vmid was empty/zero
  set_fact:
    desired_vmid: "{{ next_vmid | int }}"
  when: desired_vmid | default(0) | int == 0
  run_once: false

- name: Assert desired_vmid is valid
  assert:
    that:
      - desired_vmid is defined
      - (desired_vmid | int) > 0
    fail_msg: "desired_vmid is missing or invalid ({{ desired_vmid }}). qm nextid output: {{ qm_nextid_raw.stdout | default('') }}"

- name: Clone template into new VMID (when not exists) using qm (full vs linked)
  block:
    - name: Clone (full clone path)
      ansible.builtin.command:
        cmd: >-
          qm clone {{ vm_item.template_vmid }} {{ desired_vmid }}
          --name {{ vm_name }}
          --full
          --storage {{ storage_name }}
      delegate_to: "{{ node_name }}"
      become: true
      register: qm_clone_full
      changed_when: qm_clone_full.rc == 0 and ('clone' in (qm_clone_full.stdout | lower) or 'created' in (qm_clone_full.stdout | lower))
      failed_when: qm_clone_full.rc != 0 and ('already exists' not in (qm_clone_full.stderr | default('')) )
      when:
        - not target_exists
        - use_full_clone | bool

    - name: Clone (linked clone path — no --storage)
      ansible.builtin.command:
        cmd: >-
          qm clone {{ vm_item.template_vmid }} {{ desired_vmid }}
          --name {{ vm_name }}
      delegate_to: "{{ node_name }}"
      become: true
      register: qm_clone_linked
      changed_when: qm_clone_linked.rc == 0 and ('clone' in (qm_clone_linked.stdout | lower) or 'created' in (qm_clone_linked.stdout | lower))
      failed_when: qm_clone_linked.rc != 0 and ('already exists' not in (qm_clone_linked.stderr | default('')) )
      when:
        - not target_exists
        - not (use_full_clone | bool)

  when: not target_exists

- name: Gather VM config after ensure (qm config)
  ansible.builtin.command:
    cmd: qm config {{ desired_vmid }}
  delegate_to: "{{ node_name }}"
  become: true
  register: qm_config
  failed_when: false
  changed_when: false

# --- adjust CPU & memory to match desired settings (idempotent) ----------
- name: Compute desired cores and memory (vm -> proxmox -> defaults)
  set_fact:
    desired_cores: >-
      {{ vm_item.cores
         | default(proxmox.cpu if (proxmox is defined and 'cpu' in proxmox) else (proxmox_defaults.cpu if (proxmox_defaults is defined and 'cpu' in proxmox_defaults) else 2) )
      }}
    desired_memory: >-
      {{ vm_item.memory
         | default(proxmox.memory if (proxmox is defined and 'memory' in proxmox) else (proxmox_defaults.memory if (proxmox_defaults is defined and 'memory' in proxmox_defaults) else 2048) )
      }}
  run_once: false

- name: Parse current cores & memory from qm config (if present)
  set_fact:
    current_cores: "{{ (qm_config.stdout | regex_search('(?<=cores: )\\d+') ) | default('') }}"
    current_memory: "{{ (qm_config.stdout | regex_search('(?<=memory: )\\d+') ) | default('') }}"
  when: qm_config is defined
  run_once: false

- name: Build qm set argv for CPU/memory changes (include only differing flags)
  set_fact:
    qm_set_cfg_argv: >-
      {{
        [
          'qm', 'set', (desired_vmid | string)
        ]
        +
        ( ['--cores', (desired_cores | string)] if ( (current_cores | default('')) | string != (desired_cores | string) ) else [] )
        +
        ( ['--memory', (desired_memory | string)] if ( (current_memory | default('')) | string != (desired_memory | string) ) else [] )
      }}
  run_once: false

- name: Apply cores/memory changes via qm set (only when flags present)
  ansible.builtin.command:
    argv: "{{ qm_set_cfg_argv }}"
  delegate_to: "{{ node_name }}"
  become: true
  register: qm_set_cfg_result
  # Mark changed when the command ran successfully (rc == 0).
  # Also guard references so we don't fail if the var is undefined.
  changed_when: >
    (qm_set_cfg_result is defined) and
    (qm_set_cfg_result.rc == 0)
  # Fail only when the command returned non-zero and the stderr
  # doesn't contain an expected benign message.
  failed_when: >
    (qm_set_cfg_result is defined) and
    (qm_set_cfg_result.rc is not none) and
    (qm_set_cfg_result.rc != 0) and
    ('already configured' not in (qm_set_cfg_result.stderr | default('')))
  when: qm_set_cfg_argv | length > 3   # only run if we added flags beyond qm set <vmid>
  run_once: false

# --- Ensure network and VLAN match desired settings (idempotent) ----------

- name: Resolve VM bridge
  ansible.builtin.set_fact:
    net_bridge_resolved: >-
      {{
        vm_item.net_bridge
        | default(
            proxmox_cb.get('net_bridge')
            | default(proxmox_defaults_cb.get('net_bridge'))
          )
      }}
    net_model_resolved: "{{ vm_item.net_model | default('virtio') }}"

- name: Build net0 configuration string
  ansible.builtin.set_fact:
    net0_config: >-
      {{ net_model_resolved }},
      bridge={{ net_bridge_resolved }}
      {% if vm_item.vlan is defined and vm_item.vlan | string | length > 0 %}
      ,tag={{ vm_item.vlan }}
      {% endif %}

- name: Parse current net0 config from qm config
  set_fact:
    current_net0: "{{ (qm_config.stdout | default('')) | regex_search('(?<=net0: ).*') | default('') }}"
    current_net0_model: "{{ (qm_config.stdout | default('')) | regex_search('(?<=net0: )[a-zA-Z0-9]+(?==)') | default('') }}"

- name: Configure network device (bridge + VLAN, only if different)
  ansible.builtin.command:
    argv:
      - qm
      - set
      - "{{ desired_vmid }}"
      - --net0
      - "{{ net0_config | regex_replace('\\s+', '') }}"
  delegate_to: "{{ node_name }}"
  register: net_config_result
  changed_when: net_config_result.rc == 0
  when: >
    (current_net0_model != net_model_resolved)
    or (('bridge=' ~ net_bridge_resolved) not in current_net0)
    or ((vm_item.vlan is defined and vm_item.vlan | string | length > 0) and (('tag=' ~ (vm_item.vlan | string)) not in current_net0))
    or ((vm_item.vlan is not defined or vm_item.vlan | string | length == 0) and ('tag=' in current_net0))

- name: Parse current tags from qm config
  set_fact:
    current_tags: >-
      {{ ((qm_config.stdout | default('')) | regex_search('(?<=tags: ).*') | default('')).split(',') | map('trim') | select | list | sort }}
    desired_tags: "{{ (vm_item.tags.split(',') | map('trim') | list | sort) if vm_item.tags is defined else [] }}"

- name: Set Proxmox VM tags (if defined and different)
  ansible.builtin.command:
    cmd: qm set {{ desired_vmid }} --tags {{ vm_item.tags }}
  delegate_to: "{{ node_name }}"
  become: true
  register: tags_result
  changed_when: tags_result.rc == 0
  when:
    - vm_item.tags is defined
    - current_tags != desired_tags

# --- disk size parsing -------------------------------------------------------

- name: Parse current bootdisk raw/fallback lists from qm config (safe)
  set_fact:
    current_disk_size_raw_list: "{{ (qm_config.stdout | default('')) | regex_findall(disk_target ~ ':[^\\n]*size=([^,\\n\\s]+)') }}"
    current_disk_size_fallback_list: "{{ (qm_config.stdout | default('')) | regex_findall(disk_target ~ ':[^\\n]*,([^,\\n\\s]*G)') }}"
  run_once: false

- name: Pick first parsed disk size raw & fallback into simple vars
  set_fact:
    current_disk_size_raw: "{{ (current_disk_size_raw_list | first) | default('') }}"
    current_disk_size_fallback: "{{ (current_disk_size_fallback_list | first) | default('') }}"
  run_once: false

- name: Compute final current_disk_size (prefer raw then fallback)
  set_fact:
    current_disk_size: >-
      {{ current_disk_size_raw if (current_disk_size_raw is defined and (current_disk_size_raw | length) > 0)
         else (current_disk_size_fallback | default('')) }}
  run_once: false

- name: Compute desired_disk_gib and current_disk_gib (numeric GiB)
  set_fact:
    desired_disk_gib: "{{ (vm_item.disk_size | default('0')) | regex_replace('(?i)g$','') | regex_replace('[^0-9\\.]+','') | float | default(0) }}"
    current_disk_gib: "{{ (current_disk_size | default('0')) | regex_replace('(?i)g$','') | regex_replace('[^0-9\\.]+','') | float | default(0) }}"
  when: vm_item.disk_size is defined
  run_once: false

- name: Decide whether resize is needed (compare numeric GiB)
  set_fact:
    should_resize: "{{ (desired_disk_gib | float) > (current_disk_gib | float) }}"
  when: vm_item.disk_size is defined
  run_once: false

# --- robust resize block -----------------------------------------------------

- name: Discover candidate disk keys from qm config
  set_fact:
    _qm_disk_keys: "{{ (qm_config.stdout | default('')) | regex_findall('(?:\\n|^)\\s*([a-zA-Z0-9_]+\\d*):') }}"
  run_once: false

- name: Ensure disk_target_resolved is set (vm_item -> vars -> parse qm_config -> fallback)
  set_fact:
    disk_target_resolved: >-
      {{
        (vm_item.disk_target | default(''))
        | default( disk_target | default(proxmox_defaults.disk_target | default('')) )
        | default( (_qm_disk_keys | first) | default('scsi0') )
      }}
  run_once: false

- name: Resize disk to desired size (qm disk resize)
  ansible.builtin.command:
    cmd: >-
      qm disk resize {{ desired_vmid }} {{ disk_target_resolved }} {{ vm_item.disk_size }}
  delegate_to: "{{ node_name }}"
  become: true
  register: qm_resize_result
  changed_when: qm_resize_result.rc == 0
  when:
    - not target_exists
    - vm_item.disk_size is defined
    - should_resize | default(true)

# --- userdata / snippet ------------------------------------------------------

- name: Render userdata locally (cloudbase for windows, cloud-init for linux)
  ansible.builtin.template:
    src: "{{ 'windows-cloudbase-init-userdata.j2' if cloud_type == 'windows' else 'linux-user-data.j2' }}"
    dest: "/tmp/proxmox_{{ vm_name }}_{{ desired_vmid }}.userdata"
  delegate_to: localhost
  register: userdata_render

- name: Resolve raw snippets dir from variables (safe)
  set_fact:
    _proxmox_snippets_raw: >-
      {{ (
           (proxmox.snippets_dir if (proxmox is defined and proxmox is mapping and 'snippets_dir' in proxmox) else
            (proxmox_defaults.snippets_dir if (proxmox_defaults is defined and proxmox_defaults is mapping and 'snippets_dir' in proxmox_defaults) else
             '/var/lib/vz/snippets'
            )
           )
         ) }}
  run_once: false

- name: Normalize snippets_dir_resolved (force leading slash, collapse doubles)
  set_fact:
    snippets_dir_resolved: >-
      {{ ('/' ~ (_proxmox_snippets_raw | default('var/lib/vz/snippets'))) | regex_replace('/+','/') }}
  run_once: false

- name: Ensure snippets directory exists on node (create if missing)
  ansible.builtin.file:
    path: "{{ snippets_dir_resolved }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  delegate_to: "{{ node_name }}"
  become: true

- name: Copy userdata/snippet to node snippets dir (using resolved dir)
  ansible.builtin.copy:
    src: "{{ userdata_render.dest }}"
    dest: "{{ (snippets_dir_resolved | regex_replace('/$','')) ~ '/' ~ ( 'cloudbase-' if cloud_type == 'windows' else 'user-data-' ) ~ (desired_vmid | string) }}"
    owner: root
    mode: '0600'
  delegate_to: "{{ node_name }}"
  become: true
  when: userdata_render is defined and userdata_render.dest is defined

- name: Resolve NetBox credential variables for this host
  set_fact:
    netbox_resolved_api_url: "{{ (netbox | default({})).api_url | default(netbox_api_url | default('')) }}"
    netbox_resolved_token: "{{ (netbox | default({})).token | default(netbox_token | default('')) }}"
  run_once: false

- name: Safety-check NetBox configuration
  assert:
    that:
      - >
          (vm_item.ip | default('') | length > 0)
          or
          (netbox_allocate_ip | bool)

      - >
          (vm_item.ip | default('') | length > 0)
          or
          (netbox_resolved_api_url | length > 0)

      - >
          (vm_item.ip | default('') | length > 0)
          or
          (netbox_resolved_token | length > 0)

    fail_msg: >-
      NetBox IP allocation is enabled, but required NetBox API settings are missing.

- name: Resolve NetBox IP range
  set_fact:
    netbox_ip_range_id: "{{ netbox_ip_ranges_by_bridge[net_bridge_resolved] }}"

- name: Allocate IP from NetBox when ip is not defined and allocation is enabled
  block:
    - name: Lookup IP range
      uri:
        url: >-
          {{ netbox_resolved_api_url.rstrip('/') }}/api/ipam/ip-ranges/{{ netbox_ip_range_id }}/
        method: GET
        headers:
          Authorization: "Bearer {{ netbox_resolved_token }}"
          Accept: application/json
      register: netbox_ip_range

    - name: Allocate next IP from NetBox range
      uri:
        url: >-
          {{ netbox_resolved_api_url.rstrip('/') }}/api/ipam/ip-ranges/{{ netbox_ip_range_id }}/available-ips/
        method: POST
        headers:
          Authorization: "Token {{ netbox_resolved_token }}"
          Accept: application/json
        body_format: json
        body: {}
        status_code: 201
      register: netbox_available_ip

    - name: Assert NetBox returned an available IP
      assert:
        that:
          - netbox_available_ip.json | length > 0

    - name: Set allocated VM IP
      set_fact:
        resolved_vm_ip: "{{ netbox_available_ip.json.address }}"
  when:
    - (vm_item.ip is not defined or vm_item.ip == "")
    - netbox_allocate_ip | default(true) | bool
  run_once: false

- name: Set final VM IP and gateway variables for later configuration
  set_fact:
    vm_ip: >-
      {{ vm_item.ip
         if (vm_item.ip is defined and vm_item.ip | length > 0)
         else (resolved_vm_ip | default('')) }}
    vm_gateway: >-
      {{ vm_item.gateway
         if (vm_item.gateway is defined and vm_item.gateway | length > 0)
         else (netbox_gateway_by_bridge[net_bridge_resolved] | default('')) }}
  run_once: false
- name: Decide whether to update cicustom/ipconfig/DNS for VM
  set_fact:
    current_cicustom: "{{ (qm_config.stdout | regex_search('cicustom:.*') ) | default('') }}"
    current_ipconfig: "{{ (qm_config.stdout | regex_search('ipconfig\\d+:.*') ) | default('') }}"
    current_nameserver: "{{ (qm_config.stdout | regex_search('nameserver:.*') ) | default('') }}"
    current_searchdomain: "{{ (qm_config.stdout | regex_search('searchdomain:.*') ) | default('') }}"
  when: qm_config.stdout is defined

- name: Build desired cicustom and ip/DNS strings (works for Linux & Windows)
  set_fact:
    desired_cicustom: "user=local:snippets/{{ 'cloudbase-' if cloud_type == 'windows' else 'user-data-' }}{{ desired_vmid }}"
    desired_ipconfig: >-
      {% if vm_ip is defined and vm_ip | length > 0 %}
      ip={{ vm_ip }}{% if vm_gateway is defined and vm_gateway | length > 0 %},gw={{ vm_gateway }}{% endif %}
      {% else %}
      ""
      {% endif %}
    desired_nameserver: >-
      {% if vm_item.dns_servers is defined and vm_item.dns_servers %}
      {{ (vm_item.dns_servers | join(' ')) }}
      {% else %}""{% endif %}
    desired_searchdomain: >-
      {% if vm_item.search_domains is defined and vm_item.search_domains %}
      {{ (vm_item.search_domains | join(' ')) }}
      {% else %}""{% endif %}

- name: Build qm set argv (only include flags that have values)
  set_fact:
    qm_set_argv: >-
      {{
        [
          'qm', 'set', (desired_vmid | string),
          '--cicustom', desired_cicustom
        ]
        +
        (
          ['--ipconfig0',
           'ip=' ~ vm_ip ~ (
             (vm_gateway is defined and vm_gateway | length > 0) and (',gw=' ~ vm_gateway) or ''
           )
          ] if (vm_ip is defined and vm_ip | length > 0) else []
        )
        +
        (
          ['--nameserver', (vm_item.dns_servers | join(' '))]
          if (vm_item.dns_servers is defined and (vm_item.dns_servers | length) > 0) else []
        )
        +
        (
          ['--searchdomain', (vm_item.search_domains | join(' '))]
          if (vm_item.search_domains is defined and (vm_item.search_domains | length) > 0) else []
        )
      }}

- name: QM set - update cicustom/ipconfig/DNS only if different
  ansible.builtin.command:
    argv: "{{ qm_set_argv }}"
  delegate_to: "{{ node_name }}"
  become: true
  register: qm_set_result
  changed_when: >
    qm_set_result.rc == 0 and (
      'updated' in (qm_set_result.stdout | default('') | lower)
      or 'set' in (qm_set_result.stdout | default('') | lower)
    )
  when: >
    (current_cicustom != desired_cicustom)
    or (vm_ip is defined and vm_ip | length > 0 and (current_ipconfig | default('')) != desired_ipconfig)
    or (vm_item.dns_servers is defined and vm_item.dns_servers and
        (current_nameserver | default('')) != ('nameserver: ' ~ (vm_item.dns_servers | join(' '))))
    or (vm_item.search_domains is defined and vm_item.search_domains and
        (current_searchdomain | default('')) != ('searchdomain: ' ~ (vm_item.search_domains | join(' '))))
  failed_when: qm_set_result.rc != 0 and ('already configured' not in (qm_set_result.stderr | default('')) )

# --- start & wait -----------------------------------------------------------

- name: Start the VM (when newly cloned)
  ansible.builtin.command:
    cmd: qm start {{ desired_vmid }}
  delegate_to: "{{ node_name }}"
  become: true
  register: qm_start
  changed_when: "'status' in (qm_start.stdout | default('')) or qm_start.rc == 0"
  when: not target_exists

- name: Wait for guest to accept connections (linux => SSH, windows => WinRM)
  block:
    - name: Wait for TCP port for guest (linux:22 windows:5985/5986)
      ansible.builtin.wait_for:
        host: "{{ vm_ip | regex_replace('/\\d+$','') }}"
        port: "{{ 5986 if vm_item.winrm_ssl | default(False) else (5985 if cloud_type == 'windows' else 22) }}"
        timeout: "{{ proxmox_clone_wait.service_timeout | default(600) }}"
        state: started
        delay: 10
        sleep: "{{ proxmox_clone_wait.poll_interval | default(5) }}"
      delegate_to: localhost
      register: wait_for_port

    - name: Attempt verification command after service is reachable
      block:
        - name: Check Linux with a simple SSH command (if linux)
          ansible.builtin.command: echo ok
          when: cloud_type == 'linux'
          register: linux_ping_result
          failed_when: false
          delegate_to: localhost
          changed_when: false

        - name: Check Windows using winrm (win_ping) - requires pywinrm & connection
          ansible.builtin.debug:
            msg: "WinRM reachable on {{ resolved_vm_ip | regex_replace('/\\d+$','') }} (win_ping should be executed by a follow-up Windows play with connection: winrm)"
          when: cloud_type == 'windows'
      rescue:
        - name: Warn that service check failed
          ansible.builtin.debug:
            msg: "Service port reachable but verification failed for {{ vm_name }} (vmid {{ desired_vmid }})."
  when: vm_ip is defined and vm_ip | length > 0

# Bump next_vmid if auto-calculated
- name: Bump next_vmid if we autocalculated
  set_fact:
    next_vmid: "{{ next_vmid | int + 1 }}"
  when: vm_item.vmid is not defined or (vm_item.vmid | int) == 0
