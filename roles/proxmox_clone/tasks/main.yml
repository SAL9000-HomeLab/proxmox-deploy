---
# roles/proxmox_clone/tasks/main.yml

- name: Test first task
  debug:
    msg: "Role started"

- name: Merge Proxmox defaults
  set_fact:
    proxmox: >-
      {{
        proxmox_defaults
        | combine(proxmox | default({}), recursive=True)
      }}

- name: Ensure provision_vms present
  assert:
    that:
      - provision_vms is defined
      - provision_vms | length > 0
    fail_msg: "No provision_vms defined. Pass provision_vms via AWX extra vars, inventory, host_vars, or group_vars/proxmox.yml."

# Loop the per-VM tasks; vm_item is the loop var
- name: Provision VMs from list (include per-VM task file)
  include_tasks: provision_vm.yml
  loop: "{{ provision_vms }}"
  loop_control:
    loop_var: vm_item
