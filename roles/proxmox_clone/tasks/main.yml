---
# roles/proxmox_clone/tasks/main.yml

- name: Merge Proxmox defaults
  ansible.builtin.set_fact:
    proxmox: >-
      {{
        proxmox_defaults
        | combine(proxmox | default({}), recursive=True)
      }}

- name: Ensure provision_vms present
  ansible.builtin.assert:
    that:
      - provision_vms is defined
      - provision_vms | length > 0
    fail_msg: >-
      No provision_vms defined. Pass provision_vms via AWX extra vars, inventory, host_vars,
      or group_vars/proxmox.yml.

# Loop the per-VM tasks; vm_item is the loop var. Every per-VM task delegates to the VM's node, so the first host
# in the play provisions all of them; on every host, each VM would be cloned once per Proxmox node in the inventory.
- name: Provision VMs from list (include per-VM task file)
  ansible.builtin.include_tasks: provision_vm.yml
  loop: "{{ provision_vms }}"
  loop_control:
    loop_var: vm_item
  when: inventory_hostname == ansible_play_hosts[0]
