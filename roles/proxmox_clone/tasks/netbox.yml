---
- name: Resolve NetBox credential variables for this host
  set_fact:
    netbox_resolved_api_url: "{{ (netbox | default({})).api_url | default(netbox_api_url | default('')) }}"
    netbox_resolved_token: "{{ (netbox | default({})).token | default(netbox_token | default('')) }}"
  run_once: false

- name: Safety-check NetBox configuration
  assert:
    that:
      - >
          (vm_item.ip | default('') | length > 0)
          or
          (allocate_ip | bool)

      - >
          (vm_item.ip | default('') | length > 0)
          or
          (netbox_resolved_api_url | length > 0)

      - >
          (vm_item.ip | default('') | length > 0)
          or
          (netbox_resolved_token | length > 0)

    fail_msg: >-
      NetBox IP allocation is enabled, but required NetBox API settings are missing.

- name: Resolve VM bridge
  ansible.builtin.set_fact:
    net_bridge_resolved: >-
      {{
        vm_item.net_bridge
        | default(
            proxmox_cb.get('net_bridge')
            | default(proxmox_defaults_cb.get('net_bridge'))
          )
      }}

- name: Resolve NetBox IP range
  set_fact:
    netbox_ip_range_id: "{{ ip_ranges_by_bridge[net_bridge_resolved] }}"

- name: Resolve NetBox prefix mapping
  ansible.builtin.set_fact:
    netbox_gateway_cidr: "{{ gateway_by_bridge[net_bridge_resolved] | default('') }}"

- name: Allocate IP from NetBox when ip is not defined and allocation is enabled
  block:

    - name: Lookup IP range
      uri:
        url: >-
          {{ netbox_resolved_api_url.rstrip('/') }}/api/ipam/ip-ranges/{{ netbox_ip_range_id }}/
        method: GET
        headers:
          Authorization: "Bearer {{ netbox_resolved_token }}"
          Accept: application/json
      register: netbox_ip_range

    - debug:
        var: netbox_ip_range.json

    - name: Allocate next IP from NetBox range
      uri:
        url: >-
          {{ netbox_resolved_api_url.rstrip('/') }}/api/ipam/ip-ranges/{{ netbox_ip_range_id }}/available-ips/
        method: POST
        headers:
          Authorization: "Token {{ netbox_resolved_token }}"
          Accept: application/json
        body_format: json
        body: {}
        status_code: 201
      register: netbox_available_ip

# --- debug NetBox response and assert available IP exists --->
    - name: Show NetBox response
      debug:
        var: netbox_available_ip.json
# --- end debug NetBox response and assert available IP exists --->

    - name: Assert NetBox returned an available IP
      assert:
        that:
          - netbox_available_ip.json | length > 0

    - name: Set allocated VM IP
      set_fact:
        resolved_vm_ip: "{{ netbox_available_ip.json.address }}"
  when:
    - (vm_item.ip is not defined or vm_item.ip == "")
    - allocate_ip | default(true) | bool
  run_once: false

- name: Set final VM IP and gateway variables for later configuration
  set_fact:
    vm_ip: >-
      {{ vm_item.ip
         if (vm_item.ip is defined and vm_item.ip | length > 0)
         else (resolved_vm_ip | default('')) }}
    vm_gateway: >-
      {{ vm_item.gateway
         if (vm_item.gateway is defined and vm_item.gateway | length > 0)
         else (gateway_by_bridge[net_bridge_resolved] | default('')) }}
  run_once: false

- name: Normalize networking
  set_fact:

    vm_network:

      ip: "{{ resolved_vm_ip }}"

      cidr: "{{ resolved_vm_cidr }}"

      gateway: "{{ gateway_resolved }}"

      dns: "{{ dns_servers_resolved }}"

      bridge: "{{ net_bridge_resolved }}"