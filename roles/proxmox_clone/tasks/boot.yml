---
# roles/proxmox_clone/tasks/boot.yml
# Start the VM if it isn't running and wait for the guest OS to come up.
# Expects vm_item loop variable and facts from resolve_vars.yml / clone.yml / cloudinit.yml.

# Check actual power state rather than "newly cloned", so a VM left stopped by a
# previously failed run is still started on re-run.
- name: Get current VM power state
  ansible.builtin.command:
    cmd: qm status {{ desired_vmid }}
  delegate_to: "{{ node_name }}"
  become: true
  register: qm_status
  changed_when: false

- name: Start the VM (when not running)
  ansible.builtin.command:
    cmd: qm start {{ desired_vmid }}
  delegate_to: "{{ node_name }}"
  become: true
  register: qm_start
  changed_when: qm_start.rc == 0
  when: "'status: running' not in qm_status.stdout"

- name: Configure the Windows guest over the QEMU guest agent
  ansible.builtin.include_tasks: windows_guest.yml
  when: cloud_type == 'windows'

- name: Wait for guest to accept connections (linux => SSH, windows => WinRM)
  when: vm_ip is defined and vm_ip | length > 0
  block:
    # Windows: WinRM over HTTP (Kerberos/NTLM only). The HTTPS listener on 5986 comes later, from the
    # windows_domain_member play, once the VM has its domain certificate.
    - name: Wait for TCP port for guest (linux:22 windows:5985)
      ansible.builtin.wait_for:
        host: "{{ vm_ip | regex_replace('/\\d+$', '') }}"
        port: "{{ 5985 if cloud_type == 'windows' else 22 }}"
        timeout: "{{ proxmox_clone_wait.service_timeout | default(600) }}"
        state: started
        delay: 10
        sleep: "{{ proxmox_clone_wait.poll_interval | default(5) }}"
      delegate_to: localhost
      register: wait_for_port

    - name: Attempt verification command after service is reachable
      block:
        - name: Check Linux with a simple SSH command (if linux)
          ansible.builtin.command: echo ok
          when: cloud_type == 'linux'
          register: linux_ping_result
          failed_when: false
          delegate_to: localhost
          changed_when: false

        - name: Report that WinRM is reachable (the windows_domain_member play connects next)
          ansible.builtin.debug:
            msg: "WinRM reachable on {{ vm_ip_address }} ({{ vm_name }})"
          when: cloud_type == 'windows'
      rescue:
        - name: Warn that service check failed
          ansible.builtin.debug:
            msg: "Service port reachable but verification failed for {{ vm_name }} (vmid {{ desired_vmid }})."

# cloud-init formats and mounts data disks at the end of the first boot (after its package update), so this waits
# longer than the SSH check. It only does that on a VM's first boot: a data disk added to an existing VM is attached
# but not mounted, so for those it only warns.
- name: Wait for the data disks to be mounted (Linux)
  when:
    - cloud_type == 'linux'
    - data_disks_mounted | length > 0
  block:
    - name: Wait for the QEMU guest agent (Linux)
      ansible.builtin.command:
        cmd: qm guest cmd {{ desired_vmid }} ping
      delegate_to: "{{ node_name }}"
      become: true
      register: data_disk_agent
      until: data_disk_agent.rc == 0
      retries: "{{ (proxmox_clone_wait.service_timeout | default(600) | int) // 10 }}"
      delay: 10
      changed_when: false

    - name: Wait for each data disk's mount point
      ansible.builtin.command:
        argv: [qm, guest, exec, "{{ desired_vmid }}", --timeout, "30", --, findmnt, -n, "{{ data_disk.mount }}"]
      delegate_to: "{{ node_name }}"
      become: true
      register: data_disk_mounted
      until: >-
        data_disk_mounted.rc == 0
        and (data_disk_mounted.stdout | from_json).exitcode | default(1) == 0
      retries: "{{ ((proxmox_clone_wait.service_timeout | default(600) | int) // 10) if not target_exists else 0 }}"
      delay: 10
      changed_when: false
      loop: "{{ data_disks_mounted }}"
      loop_control:
        loop_var: data_disk
        label: "{{ data_disk.name }} on {{ data_disk.mount }}"
  rescue:
    - name: Read the end of the cloud-init log
      ansible.builtin.command:
        argv:
          [qm, guest, exec, "{{ desired_vmid }}", --timeout, "30", --, tail, -n, "40", /var/log/cloud-init-output.log]
      delegate_to: "{{ node_name }}"
      become: true
      register: data_disk_cloud_init_log
      changed_when: false
      failed_when: false

    - name: Report the data disks that aren't mounted
      ansible.builtin.fail:
        msg: >-
          {{ vm_name }}: data disks aren't mounted ({{ data_disks_mounted | map(attribute='mount') | join(', ') }}).
          End of /var/log/cloud-init-output.log:
          {{ ((data_disk_cloud_init_log.stdout | default('{}') | from_json)['out-data'] | default('(unreadable)'))
             | trim }}
      when: not target_exists

    - name: Warn that an existing VM's data disks aren't mounted
      ansible.builtin.debug:
        msg: >-
          {{ vm_name }} already existed, and cloud-init only formats and mounts data disks on a VM's first boot.
          Mount a newly attached disk yourself: /usr/local/sbin/setup-data-disk <name> <fs> <mount point> (copy
          it from proxmox-deploy's roles/proxmox_clone/files/ if the VM doesn't have it).
      when: target_exists

# Bump next_vmid if auto-calculated
- name: Bump next_vmid if we auto-calculated
  ansible.builtin.set_fact:
    next_vmid: "{{ next_vmid | int + 1 }}"
  when: vm_item.vmid is not defined or (vm_item.vmid | int) == 0
