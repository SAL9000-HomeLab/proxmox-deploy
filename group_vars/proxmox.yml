# group_vars/proxmox.yml
# AWX-friendly sample vars file for site.yml.
#
# Use AWX extra vars for job-driven provisioning, e.g.:
#   provision_vms: "@vm_list.yml"
#   proxmox:
#     storage: nfs_ssd
#     net_bridge: vmbr0
#   proxmox_creds_file: "/path/to/proxmox_creds.yml"
#   domain_join_file: "/path/to/domain_join.yml"
#
# Leave this file enabled if you want fallback defaults for AWX or local execution.

proxmox:
  # Default node — used if per-VM node is not set. Must match your inventory host name.
  node: pve01.lab.sal9000.tech
  storage: nfs_ssd                   # storage name where clones should be created
  net_bridge: vnet30
  timeout: 300

netbox_allocate_ip: true
netbox_ip_ranges_by_bridge:
  vnet20: 3
  vnet30: 19
  vnet40: 20
  vnet150: 21
netbox_gateway_by_bridge:
  vnet20: 10.100.20.1
  vnet30: 10.100.30.1
  vnet40: 10.100.40.1
  vnet150: 10.100.150.1

# Optional AWX credential file paths used by site.yml:
# proxmox_creds_file: "~/ansible-secrets/proxmox/proxmox_creds.yml"
# domain_join_file: "~/ansible-secrets/windows/domain_join.yml"

