---
- name: Debug Proxmox API visibility (runs on control host)
  hosts: localhost
  gather_facts: false
  vars_files:
    - "{{ lookup('env','HOME') }}/ansible-secrets/proxmox/proxmox_creds.yml"

  tasks:
    - name: Print proxmox api connection info (debug)
      ansible.builtin.debug:
        msg:
          api_host: "{{ proxmox.api_host | default('NOT SET') }}"
          node_default: "{{ proxmox.node | default('NOT SET') }}"

    - name: List cluster qemu resources via community.proxmox
      community.proxmox.proxmox:
        api_host: "{{ proxmox.api_host }}"
        api_user: "{{ proxmox.api_user }}"
        api_token_id: "{{ proxmox.api_token_id }}"
        api_token_secret: "{{ proxmox.api_token_secret }}"
        action: get_resources
      register: cluster_resources
      failed_when: false

    - name: Show qemu vmids/names found via API (first 200 entries)
      ansible.builtin.debug:
        msg: "{{ cluster_resources.resources | selectattr('type','equalto','qemu') | map(attribute='vmid') | list | sort | unique | join(', ') }}"
      when: cluster_resources is defined and cluster_resources.resources is defined

    - name: Show full cluster_resources (first 4000 chars)
      ansible.builtin.debug:
        msg: "{{ cluster_resources | to_nice_json | truncate(4000) }}"
      when: cluster_resources is defined
